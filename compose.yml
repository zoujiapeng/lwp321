services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: talk_records
      MYSQL_USER: talk
      MYSQL_PASSWORD: ${DB_PASSWORD:?请先在.env设置DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先在.env设置MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -uroot --silent']
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    environment:
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?请先在.env设置APP_ADMIN_PASSWORD}
      DB_URL: jdbc:mysql://db:3306/talk_records?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USER: talk
      DB_PASSWORD: ${DB_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:8080:8080'
    restart: unless-stopped
volumes:
  mysql-data:
